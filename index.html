<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <title>Main page</title>
  <meta name="description" content="Create o7 App">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iceberg&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="media/favicon.png">
  <link rel="stylesheet" href="dist/reset.css">
  <link rel="stylesheet" href="dist/style.css">
</head>

<body>
  <header class="header">
    <nav class="navbar">
      <span>Good afternoon, [name]!</span>
      <svg class="navbar-logo" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-icon lucide-user">
        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    </nav>
  </header>
  <main class="main">
    <div class="block main-graph">
      <div>20</div>
      <div>10</div>
      <div>0</div>
      <div class="graph">
        1123
      </div>
      <div></div>
      <div>M</div>
      <div>T</div>
      <div>W</div>
      <div>T</div>
      <div>F</div>
    </div>
    <div class="block main-calories">
      <div class="calorie-stack big">
        <span>1200/1500kcal</span>
        <span class="progressbar"></span>
      </div>
      <div class="calorie-group">
        <div class="calorie-stack small">
          <span>50/90g&nbsp;prtn</span>
          <span class="progressbar"></span>
        </div>
        <div class="calorie-stack small">
          <span>20/80g&nbsp;crbs</span>
          <span class="progressbar"></span>
        </div>
        <div class="calorie-stack small">
          <span>20/30g&nbsp;fats</span>
          <span class="progressbar"></span>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
      stroke-linejoin="round" class="lucide lucide-house-icon lucide-house">
      <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
      <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
    </svg>
    <button onclick="toggleOverlay()" class="plus">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-plus-icon lucide-plus">
        <path d="M5 12h14" />
        <path d="M12 5v14" />
      </svg>
    </button>
    <a href="workout_history.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open-icon lucide-book-open">
        <path d="M12 7v14" />
        <path
          d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
      </svg></a>
  </footer>
  <div id="overlay-menu" class="overlay">
    <div class="overlay-buttons">
      <a href="addworkout.html" class="action-btn">New Workout</a>
      <a href="calories.html" class="action-btn">Log Meal</a>
    </div>
  </div>
</body>
<script src="script.js"></script>
<!-- Livereload -->
<script>document.write('<script src="http://'
    + (location.host || 'localhost').split(':')[0]
    + ':35729/livereload.js"></'
    + 'script>')</script>

</html>
