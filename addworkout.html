<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta charset="utf-8">
  <title>Add Workout</title>
  <meta name="description" content="Create o7 App">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Iceberg&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/reset.css">
  <link rel="stylesheet" href="dist/style.css">
  <script>
    function addExercise() {
      const temp = document.getElementById("exercise-template");
      const nameInput = document.querySelector("#new_exercise_name");
      let reps = document.getElementById("reps_input");
      let weight = document.getElementById("weight_input");

      if (nameInput.value.trim() !== "") {
        const clone = temp.content.cloneNode(true);
        const form = document.querySelector("#exercise-form");
        clone.querySelector("legend").textContent = nameInput.value;
        form.appendChild(clone);
        nameInput.value = "";
      } else {
        alert("Please enter exercise name");
      }
    }

    function addSet(button) {
      const container = button.closest('.exercise-block').querySelector('.sets-container');
      const allSets = container.querySelectorAll('.set-row');
      const nextSetNumber = allSets.length + 1;
      const newSetRow = allSets[0].cloneNode(true);

      newSetRow.querySelector('.set-number').textContent = nextSetNumber;

      container.appendChild(newSetRow);
    }

    function recalculateSets(container) {
      const rows = container.querySelectorAll('.set-row');
      rows.forEach((row, index) => {
        row.querySelector('.set-number').textContent = index + 1;
      });
    }

    function removeSet(button) {
      const container = button.closest('.sets-container');
      const row = button.closest('.set-row');

      if (container.querySelectorAll('.set-row').length > 1) {
        row.remove();
        recalculateSets(container);
      } else {
        alert("There should be at least one set per exercise");
      }

    }

  </script>
</head>

<body>
  <header class="header">
    <nav class="navbar">
      <span><a href="index.html">cancel</a></span>
      <span>Add Workout</span>
      <span form="exercise-form">Save</span>
    </nav>
  </header>

  <main class="main">
    <div class="block main-workout">
      <form method="POST" id="exercise-form">
        <fieldset class="exercise-block">
          <legend>New exercise</legend>

          <label>Exercise name:
            <input type="text" id="new_exercise_name" name="exercise_name[]" required>
          </label> <br>
          <button class="new-exercise-btn" type="button" onclick="addExercise()">add exercise</button>
        </fieldset>

        <template id="exercise-template">
          <fieldset class="exercise-block">
            <legend>New exercise</legend>
            <div class="sets-container">
              <div class="set-row">
                <label>Set <span class="set-number">1</span>:
                  <input type="number" name="reps[]" placeholder="reps">
                  <input type="number" name="weight[]" placeholder="weight (kg)">
                </label>
                <button type="button" class="delete-set-btn" onclick="removeSet(this)"> X</button>
              </div>
            </div>

            <button type="button" class="add-set-btn" onclick="addSet(this)">Add set</button>
          </fieldset>
        </template>
      </form>

    </div>
  </main>
